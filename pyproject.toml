[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-call-scoreboard"
version = "0.1.0"
description = "Extract and score the short-term market calls YouTube trading channels make, transparently."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jennifer Hsieh"}]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "yfinance>=0.2.40",
  "youtube-transcript-api>=1.0",
  "requests>=2",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ytscore = "ytscore.cli:main"

[project.urls]
Homepage = "https://github.com/humbleambition/youtube-call-scoreboard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytscore = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
